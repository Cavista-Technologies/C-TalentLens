name: Dockerize the frontend solution

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker:
    name: Build and Push
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Login
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKERHUB_USER}}
          password: ${{secrets.DOCKERHUB_PAT}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{secrets.DOCKERHUB_USER}}/c-talentlens-web:latest
          build-args: |
            VITE_API_BASE_URL = ${{vars.API_BASE_URL}}
            VITE_CLOUDINARY_CLOUD_NAME = ${{vars.CLOUDINARY_NAME}}
            VITE_CLOUDINARY_UPLOAD_PRESET = ${{vars.VITE_CLOUDINARY_PRESET}}